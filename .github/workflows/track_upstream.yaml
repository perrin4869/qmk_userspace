name: upstream to PR

on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs: {}

permissions: {}

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    steps:
      - name: Open PR from qmk:main
        shell: bash
        env:
          # PAT so the PR triggers pull_request workflows; GITHUB_TOKEN-created PRs don't
          GH_TOKEN: ${{ secrets.PAT }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          # head lives in the parent repo, so nothing is pushed to this fork
          if out=$(gh api "repos/$GITHUB_REPOSITORY/pulls" \
              -f head=qmk:main \
              -f base="$BASE" \
              -f title="Upstream qmk/qmk_userspace main" \
              -f body="Integrating latest changes from [qmk/qmk_userspace](https://github.com/qmk/qmk_userspace) main." \
              --jq .number 2>&1); then
            echo "Pull request created: #$out"
            # assign_prs can't assign it: PRs with a head in qmk get a read-only GITHUB_TOKEN
            gh api "repos/$GITHUB_REPOSITORY/issues/$out/assignees" \
              -f "assignees[]=$GITHUB_REPOSITORY_OWNER" --silent
          elif grep -qE 'A pull request already exists|No commits between' <<<"$out"; then
            echo "$out"
          else
            echo "$out" >&2
            exit 1
          fi
